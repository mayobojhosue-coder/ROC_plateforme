<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Acceuil Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* 🌌 FOND GRADIENT SPIRITUEL */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 20px;
    color: #f5f7ff;
    min-height: 100vh;
    box-sizing: border-box;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6, #0b3d91);
    background-size: 400% 400%;
    animation: gradientAnimation 15s ease infinite;
    transition: background 1s ease-in-out;
}

/* Animation douce du gradient */
@keyframes gradientAnimation {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

header h1 {
    font-size: 1.8em;
    margin: 0;
    color: #ffd966;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

/* Boutons horizontaux */
header .buttonsLeft {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 15px;
}

header .buttonsLeft h1 {
    margin-right: 20px;
}

header .buttonsLeft button,
header .backButton {
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 18px;
    border: 2px solid #ffd966;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6);
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
}

header .buttonsLeft button:hover,
header .backButton:hover {
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 12px 28px rgba(255,217,102,0.7);
    background: linear-gradient(135deg, #1e4fd6, #3a6cff);
}

/* CONTENU CENTRAL */
.contentBox {
    background: rgba(10,20,50,0.88);
    margin: 30px auto;
    padding: 25px;
    border-radius: 26px;
    width: 90%;
    max-width: 600px;
    text-align: center;
    border: 2px solid rgba(255,217,102,0.95);
    outline: 1px solid rgba(255,217,102,0.45);
    outline-offset: 4px;
    box-shadow:
        0 0 20px rgba(255,217,102,0.6),
        0 12px 36px rgba(0,0,0,0.65);
}

.contentBox p {
    margin: 0;
    font-size: 1.2em;
    line-height: 1.9;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
}

/* MOBILE */
@media (max-width: 480px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    header .buttonsLeft {
        flex-wrap: wrap;
        gap: 10px;
    }

    header h1 {
        font-size: 1.5em;
    }

    header .buttonsLeft button,
    header .backButton {
        font-size: 14px;
        padding: 8px 16px;
    }

    .contentBox {
        padding: 20px;
    }
}
</style>
</head>
<body>

<header>
    <div class="buttonsLeft">
        <h1>Acceuil</h1>
        <button onclick="window.location.href='programmes_admin.html'">Programmes</button>
        <button onclick="window.location.href='evenements_admin.html'">Événements</button>
        <button onclick="window.location.href='outfit_admin.html'">Dress code</button>
        <button onclick="window.location.href='membres_admin.html'">Membres</button>
        <button onclick="window.location.href='liste_presence_admin.html'">Liste de présence</button>
        <button onclick="window.location.href='serviteurs_admin.html'">Serviteurs</button>
        <button onclick="window.location.href='repertoire_admin.html'">Répertoire</button>
    </div>
    <button class="backButton" onclick="window.location.href='index.html'">Retour</button>
</header>

<div class="contentBox">
    <p>
        Ici, le responsable peut gérer les programmes,  
        les événements, les outfits et les membres du groupe.
    </p>
</div>

</body>
</html>
