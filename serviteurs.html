<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Serviteurs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== FOND GENERAL ROYAL ===== */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:30px;
    color:#f5e6b8;

    background:
        linear-gradient(rgba(5,20,60,0.85), rgba(5,20,60,0.85)),
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkJj-l88rSgG6TxZShJpDFZ-17vAVmA6Ziwg&s");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* ===== HEADER ===== */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

header h1 {
    font-size:2.8em;
    margin:0;
    font-weight:700;
    color:#ffd700;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
}

header button {
    padding:14px 30px;
    font-size:18px;
    border-radius:16px;
    border:1px solid #ffd700;
    background: linear-gradient(135deg,#0b3d91,#1a237e);
    color:#ffd700;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
}

header button:hover {
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(0,0,0,0.6);
}

/* ===== BOITE CENTRALE ===== */
.contentBox {
    background:rgba(10,20,60,0.85);
    margin:0 auto;
    padding:35px;
    border-radius:22px;
    max-width:720px;
    box-shadow:0 12px 35px rgba(0,0,0,0.6);
    border:1px solid rgba(255,215,0,0.3);
}

/* ===== LISTE ===== */
#serviteursList {
    margin-top:25px;
    list-style:none;
    padding-left:0;
    display:flex;
    flex-direction:column;
    gap:14px;
}

#serviteursList li {
    background:linear-gradient(135deg,#102a6a,#0b3d91);
    padding:16px 18px;
    border-radius:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
    font-size:1.1em;
    color:#f5e6b8;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    border-left:4px solid #ffd700;
}

/* ===== DATE ===== */
#dateInfo {
    margin-top:22px;
    font-size:1em;
    text-align:right;
    color:#ffd700;
    opacity:0.9;
}

/* ===== MOBILE ===== */
@media (max-width:600px) {
    body {
        padding:20px;
    }

    header h1 {
        font-size:2.3em;
    }

    header button {
        font-size:16px;
        padding:12px 24px;
    }

    .contentBox {
        padding:28px;
    }

    #serviteursList li {
        font-size:1.15em;
        padding:18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Serviteurs</h1>
    <button onclick="window.location.href='acceuil.html'">Retour</button>
</header>

<div class="contentBox">
    <ul id="serviteursList"></ul>
    <div id="dateInfo"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLL-lZEwvyiN-5IhCY0Yqpt_ZqYbbu4s",
  authDomain: "rocplatforme.firebaseapp.com",
  projectId: "rocplatforme",
  storageBucket: "rocplatforme.firebasestorage.app",
  messagingSenderId: "655073414371",
  appId: "1:655073414371:web:0bd743e2bb5c0a23e9d6",
  measurementId: "G-262B1D5NJV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listEl = document.getElementById("serviteursList");
const dateEl = document.getElementById("dateInfo");

async function loadServiteurs(){
    listEl.innerHTML = "";
    const snapshot = await getDocs(query(collection(db,"serviteurs"), orderBy("timestamp")));
    let lastUpdate = null;

    snapshot.forEach(docSnap => {
        const data = docSnap.data();
        lastUpdate = data.timestamp ? data.timestamp.toDate() : lastUpdate;
        const li = document.createElement("li");
        li.textContent = `${data.nom} (${data.pupitre})`;
        listEl.appendChild(li);
    });

    if(lastUpdate){
        const options = { day: "2-digit", month:"long", year:"numeric" };
        dateEl.textContent = `Liste mise à jour le ${lastUpdate.toLocaleDateString("fr-FR",options)}`;
    }
}

loadServiteurs();
</script>

</body>
</html>
