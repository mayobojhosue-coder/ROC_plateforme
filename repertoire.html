<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Répertoire Journée</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background: linear-gradient(180deg,#050b1e,#0b1f4d);
    color:#f5f7ff;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
header h1 {
    font-size:1.9em;
    margin:0;
    color:#ffd966;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
}
header button {
    padding:10px 22px;
    font-size:16px;
    border-radius:14px;
    border:2px solid #ffd966;
    background: linear-gradient(135deg,#0b3d91,#144ea1);
    color:#fff;
    cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s;
}
header button:hover {
    transform: scale(1.05);
    box-shadow:0 4px 14px rgba(255,217,102,0.6);
}

/* BOUTON HISTORIQUE */
#historyBtn {
    padding:10px 18px;
    font-size:15px;
    border:2px solid #ffd966;
    border-radius:10px;
    background:#0b3d91;
    color:#fff;
    cursor:pointer;
    margin:10px 0;
}
#historyBtn:hover {
    background:#144ea1;
}

/* LISTE */
#displayList {
    background: rgba(11,61,145,0.25);
    padding:20px;
    border-radius:16px;
    margin:20px auto;
    max-width:650px;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
    border:2px solid #ffd966;
}
#displayList h4 {
    margin:12px 0 6px 0;
    font-size:1.3em;
    color:#ffd966;
}
#displayList ul {
    list-style:none;
    padding-left:0;
    margin:6px 0 12px 0;
}
#displayList li {
    padding:8px 12px;
    background: rgba(255,255,255,0.1);
    margin-bottom:6px;
    border-radius:8px;
    color:#f5f7ff;
}

/* MESSAGE */
#messageBox {
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#0b3d91;
    color:#ffd966;
    padding:10px 20px;
    border-radius:10px;
    display:none;
    z-index:9999;
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
}

/* MOBILE */
@media (max-width:480px){
    body {
        padding:25px;
    }
    header {
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }
    header h1 {
        font-size:2.1em;
    }
    header button,
    #historyBtn {
        width:100%;
        font-size:17px;
        padding:14px;
    }
    #displayList {
        padding:22px;
    }
    #displayList h4 {
        font-size:1.5em;
    }
}
</style>
</head>
<body>

<header>
    <h1>Répertoires </h1>
    <button onclick="window.location.href='acceuil.html'">Retour</button>
</header>

<button id="historyBtn">Historique</button>

<div id="displayList">
    <p>Chargement du répertoire...</p>
</div>

<div id="messageBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLL-lZEwvyiN-5IhCY0Yqpt_ZqYbbu4s",
  authDomain: "rocplatforme.firebaseapp.com",
  projectId: "rocplatforme",
  storageBucket: "rocplatforme.firebasestorage.app",
  messagingSenderId: "655073414371",
  appId: "1:655073414371:web:0bd743e2bb5c0a23e9d6",
  measurementId: "G-262B1D5NJV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const displayListEl = document.getElementById("displayList");
const messageBox = document.getElementById("messageBox");
const historyBtn = document.getElementById("historyBtn");

function showMessage(msg,duration=2500){
    messageBox.textContent = msg;
    messageBox.style.display="block";
    setTimeout(()=>{messageBox.style.display="none";},duration);
}

async function loadRepertoire(){
    displayListEl.innerHTML = "<p>Chargement du répertoire...</p>";
    try{
        const q = query(collection(db,"repertoire_jours"), orderBy("timestamp","desc"));
        const snapshot = await getDocs(q);
        if(snapshot.empty){
            displayListEl.innerHTML = "<p>Aucun répertoire disponible.</p>";
            return;
        }
        displayListEl.innerHTML = "";
        snapshot.forEach(docSnap=>{
            const data = docSnap.data();
            displayListEl.innerHTML += `<h4>${data.titre} ${data.date ? "(" + data.date + ")" : ""}</h4>`;
            if(data.adoration?.length){
                displayListEl.innerHTML += "<h4>Adoration</h4><ul>" +
                    data.adoration.map(i=>`<li>${i.titre} ${i.auteur? "(" + i.auteur + ")" : ""}</li>`).join("") +
                    "</ul>";
            }
            if(data.louange?.length){
                displayListEl.innerHTML += "<h4>Louange</h4><ul>" +
                    data.louange.map(i=>`<li>${i.titre} ${i.auteur? "(" + i.auteur + ")" : ""}</li>`).join("") +
                    "</ul>";
            }
        });
    }catch(e){
        console.error(e);
        displayListEl.innerHTML = "<p>Erreur lors du chargement du répertoire.</p>";
        showMessage("Erreur de chargement !");
    }
}

loadRepertoire();

historyBtn.addEventListener("click", async ()=>{
    displayListEl.innerHTML="<h4>Historique des listes</h4>";
    try{
        const q = query(collection(db,"repertoire_jours"), orderBy("timestamp","desc"));
        const snapshot = await getDocs(q);
        if(snapshot.empty){
            displayListEl.innerHTML += "<p>Aucun historique disponible.</p>";
            return;
        }
        snapshot.forEach(docSnap=>{
            const data = docSnap.data();
            displayListEl.innerHTML += `<h4>${data.titre} ${data.date ? "(" + data.date + ")" : ""}</h4>`;
            if(data.adoration?.length){
                displayListEl.innerHTML += "<h4>Adoration</h4><ul>" +
                    data.adoration.map(i=>`<li>${i.titre} ${i.auteur? "(" + i.auteur + ")" : ""}</li>`).join("") +
                    "</ul>";
            }
            if(data.louange?.length){
                displayListEl.innerHTML += "<h4>Louange</h4><ul>" +
                    data.louange.map(i=>`<li>${i.titre} ${i.auteur? "(" + i.auteur + ")" : ""}</li>`).join("") +
                    "</ul>";
            }
        });
    }catch(e){
        console.error(e);
        showMessage("Erreur lors du chargement de l'historique !");
    }
});
</script>

</body>
</html>
