<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Acceuil Membres</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* FOND GÉNÉRAL – PLUS VISIBLE */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background:
        linear-gradient(
            rgba(5, 15, 40, 0.55),
            rgba(5, 15, 40, 0.55)
        ),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #f5f7ff;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
}

/* TITRE */
header h1 {
    font-size: 2em;
    margin: 0;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f5d77a;
}

/* ZONE BOUTONS – HORIZONTALE */
header .buttonsLeft {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
}

/* BOUTONS – BLEU ROI + OR */
header .buttonsLeft button,
header .backButton {
    padding: 12px 22px;
    font-size: 15px;
    border-radius: 16px;
    border: 2px solid #d4af37;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6);
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    position: relative;
}

/* EFFET HOVER */
header .buttonsLeft button:hover,
header .backButton:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(212,175,55,0.35);
    background: linear-gradient(135deg, #1e4fd6, #3a6cff);
}

/* CONTENU CENTRAL */
.contentBox {
    margin: 40px auto 0;
    padding: 28px;
    max-width: 620px;
    background: rgba(10, 20, 50, 0.75);
    border-radius: 22px;
    text-align: center;
    border: 1px solid rgba(212,175,55,0.6);
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
}

.contentBox p {
    margin: 0;
    font-size: 1.05em;
    line-height: 1.7;
    color: #f0f2ff;
}

/* MOBILE */
@media (max-width: 480px) {
    body {
        padding: 12px;
        background-attachment: scroll;
    }

    header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    header h1 {
        font-size: 1.6em;
    }

    header .buttonsLeft {
        gap: 10px;
    }

    header .buttonsLeft button,
    header .backButton {
        font-size: 14px;
        padding: 10px 16px;
        border-radius: 14px;
    }

    .contentBox {
        margin-top: 26px;
        padding: 20px;
    }

    .contentBox p {
        font-size: 0.95em;
    }
}
</style>
</head>
<body>

<header>
    <div class="buttonsLeft">
        <h1>Acceuil</h1>
        <button onclick="window.location.href='programmes.html'">Programmes</button>
        <button onclick="window.location.href='evenements.html'">Événements</button>
        <button onclick="window.location.href='outfit.html'">Dress code</button>
        <button onclick="window.location.href='membres.html'">Membres</button>
        <button onclick="window.location.href='liste_presence.html'">Liste de présence</button>
        <button onclick="window.location.href='serviteurs.html'">Serviteurs</button>
        <button onclick="window.location.href='repertoire.html'">Répertoire</button>
    </div>
    <button class="backButton" onclick="window.location.href='index.html'">Retour</button>
</header>

<div class="contentBox">
    <p>Bienvenue aux membres, ici vous pouvez consulter les programmes, les événements, les outfits et accéder aux différents services.</p>
</div>

</body>
</html>
