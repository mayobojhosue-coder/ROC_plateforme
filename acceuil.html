<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Acceuil Membres</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* 🌌 FOND EN DIAPORAMA */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background-color: #00001a;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #f5f7ff;
    transition: background-image 1s ease-in-out, transform 10s ease;
    transform: scale(1);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
}

header h1 {
    font-size: 2em;
    margin: 0;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #ffd966;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.7);
}

header .buttonsLeft {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
}

header .buttonsLeft button,
header .backButton {
    padding: 12px 24px;
    font-size: 15px;
    border-radius: 18px;
    border: 2px solid #ffd966;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6);
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
}

header .buttonsLeft button:hover,
header .backButton:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 12px 28px rgba(255,217,102,0.7);
    background: linear-gradient(135deg, #1e4fd6, #3a6cff);
}

/* CONTENU CENTRAL */
.contentBox {
    margin: 50px auto 0;
    padding: 36px;
    max-width: 650px;
    background: rgba(10, 20, 50, 0.88);
    border-radius: 26px;
    text-align: center;
    border: 2px solid rgba(255, 217, 102,0.95);
    outline: 1px solid rgba(255, 217, 102,0.45);
    outline-offset: 4px;
    box-shadow:
        0 0 20px rgba(255,217,102,0.6),
        0 12px 36px rgba(0,0,0,0.65);
}

.contentBox p {
    margin: 0;
    font-size: 1.2em;
    line-height: 1.9;
    color: #f0f2ff;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
}

/* MOBILE ADAPTÉ */
@media (max-width: 480px) {
    body { padding: 12px; background-attachment: scroll; }
    header { flex-direction: column; align-items: center; gap: 12px; }
    header h1 { font-size: 1.8em; }
    header .buttonsLeft { justify-content: center; gap: 10px; }
    header .buttonsLeft button,
    header .backButton { font-size: 14px; padding: 10px 18px; border-radius: 14px; }
    .contentBox { margin-top: 30px; padding: 28px 22px; }
    .contentBox p { font-size: 1.25em; line-height: 2; }
}
</style>
</head>
<body>

<header>
    <div class="buttonsLeft">
        <h1>Acceuil</h1>
        <button onclick="window.location.href='programmes.html'">Programmes</button>
        <button onclick="window.location.href='evenements.html'">Événements</button>
        <button onclick="window.location.href='outfit.html'">Dress code</button>
        <button onclick="window.location.href='membres.html'">Membres</button>
        <button onclick="window.location.href='liste_presence.html'">Liste de présence</button>
        <button onclick="window.location.href='serviteurs.html'">Serviteurs</button>
        <button onclick="window.location.href='repertoire.html'">Répertoire</button>
    </div>
    <button class="backButton" onclick="window.location.href='index.html'">Retour</button>
</header>

<div class="contentBox">
    <p>Bienvenue aux membres, ici vous pouvez consulter les programmes, les événements, les outfits et accéder aux différents services.</p>
</div>

<script>
// —————— DIAPORAMA SPIRITUEL AVEC ZOOM DOUX ——————
const backgrounds = [
    // Image principale envoyée par l'utilisateur (entièrement visible)
    "https://d3t3ozftmdmh3i.cloudfront.net/staging/podcast_uploaded_nologo400/39568150/39568150-1699708650085-977297d8a525.jpg",
    // Autres images spirituelles
    "https://images.unsplash.com/photo-1586250477482-b26abdbd8a35?auto=format&fit=crop&w=1470&q=80", // Bible
    "https://images.unsplash.com/photo-1606813903264-d8e6a7e6e6e5?auto=format&fit=crop&w=1470&q=80", // Église lumière
    "https://images.unsplash.com/photo-1506027249980-167db8eb6ee7?auto=format&fit=crop&w=1470&q=80", // Louange
    "https://images.unsplash.com/photo-1549893074-df0e99aaef83?auto=format&fit=crop&w=1470&q=80", // Méditation
    "https://images.unsplash.com/photo-1587316745621-3757a4b0b7e7?auto=format&fit=crop&w=1470&q=80"  // Chapelet
];

let index = 0;

function showBackground() {
    const imageUrl = backgrounds[index];
    
    // L'image principale reste entièrement visible (contain), les autres zoom légèrement (cover)
    if(index === 0){
        document.body.style.backgroundSize = "contain";
        document.body.style.backgroundPosition = "center";
        document.body.style.transform = "scale(1)";
    } else {
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.transform = "scale(1.05)";
    }

    document.body.style.backgroundImage = 
        `linear-gradient(rgba(0,0,30,0.55), rgba(0,0,50,0.55)), url(${imageUrl})`;
    
    index = (index + 1) % backgrounds.length;
}

// Initial display
showBackground();

// Changement toutes les 10 secondes
setInterval(showBackground, 10000);
</script>

</body>
</html>
