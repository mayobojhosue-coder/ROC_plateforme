<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Programmes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ===== STYLE ROYAL ===== */

body {
    font-family: "Georgia", serif;
    margin: 0;
    min-height: 100vh;
    padding: 40px;
    box-sizing: border-box;
    background: radial-gradient(circle at top, #0b3d91 0%, #020b2a 70%);
    color: #ffd966;
    position: relative;
    overflow-x: hidden;
}

/* IMAGE SPIRITUELLE DROITE */
body::before {
    content: "";
    position: fixed;
    bottom: 0;
    right: 0;
    width: 45%;
    height: 45%;
    background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=60")
        no-repeat center center;
    background-size: cover;
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
}

/* IMAGE SPIRITUELLE GAUCHE */
body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 40%;
    height: 40%;
    background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=60")
        no-repeat center center;
    background-size: cover;
    opacity: 0.07;
    pointer-events: none;
    z-index: 0;
}

/* CONTENU AU-DESSUS DES IMAGES */
body > * {
    position: relative;
    z-index: 1;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 40px;
}

header h1 {
    font-size: 3em;
    margin:0;
    color: #ffd966;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

/* BOUTON RETOUR */
header .backButton {
    padding:14px 34px;
    font-size:18px;
    border-radius:16px;
    border:2px solid #ffd966;
    background: linear-gradient(145deg,#0b3d91,#144ea1);
    color:#ffd966;
    cursor:pointer;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    transition: transform 0.2s, box-shadow 0.2s;
}

header .backButton:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(255,217,102,0.6);
}

/* BOITE CENTRALE */
.contentBox {
    margin: 0 auto;
    padding: 45px;
    width: 95%;
    max-width: 950px;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(11,61,145,0.95), rgba(0,0,0,0.9));
    border: 2px solid #ffd966;
    box-shadow:
        inset 0 0 25px rgba(255,217,102,0.15),
        0 12px 35px rgba(0,0,0,0.8);
}

.contentBox h3 {
    font-size: 2.1em;
    margin-bottom: 30px;
    color: #ffd966;
    text-align: center;
    text-shadow: 0 3px 10px rgba(0,0,0,0.7);
}

/* PROGRAMMES */
.programmeItem {
    margin:22px 0;
    padding:25px 30px;
    border-radius:18px;
    background: linear-gradient(
        145deg,
        rgba(255,217,102,0.08),
        rgba(11,61,145,0.25)
    );
    border-left: 6px solid #ffd966;
    box-shadow:
        inset 0 0 15px rgba(255,217,102,0.15),
        0 6px 18px rgba(0,0,0,0.6);
}

.programmeItem h4 {
    margin:0 0 12px 0;
    font-size: 1.5em;
    color: #ffd966;
}

.programmeItem p {
    margin:0;
    font-size: 1.15em;
    line-height: 1.7;
    color: #f5f7ff;
}

/* RESPONSIVE */
@media (max-width:480px){
    body { padding: 20px; }

    header h1 { font-size:2.2em; }

    header .backButton {
        font-size:15px;
        padding:10px 22px;
    }

    .contentBox {
        padding:28px;
    }

    .contentBox h3 {
        font-size:1.6em;
    }

    .programmeItem h4 {
        font-size:1.25em;
    }

    .programmeItem p {
        font-size:1em;
    }
}
</style>
</head>
<body>

<header>
    <h1>Programmes</h1>
    <button class="backButton" onclick="window.location.href='acceuil.html'">Retour</button>
</header>

<div class="contentBox">
    <h3>Programmes prévus :</h3>
    <div id="programmesList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLL-lZEwvyiN-5IhCY0Yqpt_ZqjYbbu4s",
  authDomain: "rocplatforme.firebaseapp.com",
  projectId: "rocplatforme",
  storageBucket: "rocplatforme.firebasestorage.app",
  messagingSenderId: "655073414371",
  appId: "1:655073414371:web:0bd743e2bb5c0a23e9c9d6",
  measurementId: "G-262B1D5NJV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const programmesList = document.getElementById('programmesList');

const q = query(collection(db,"programmes"), orderBy("timestamp"));
onSnapshot(q,(snapshot)=>{
    programmesList.innerHTML = "";
    snapshot.forEach(docSnap=>{
        const data = docSnap.data();
        const div = document.createElement('div');
        div.className = "programmeItem";
        div.innerHTML = `<h4>${data.day} à ${data.time}</h4><p>${data.texte}</p>`;
        programmesList.appendChild(div);
    });
});
</script>

</body>
</html>
