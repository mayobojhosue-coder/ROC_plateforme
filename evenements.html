<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Événements ROC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* 🌌 FOND GRADIENT SPIRITUEL */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:20px;
    min-height:100vh;
    color:#f5f7ff;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6, #0b3d91);
    background-size: 400% 400%;
    animation: gradientAnimation 15s ease infinite;
    transition: background 1s ease-in-out;
}

/* Animation du gradient */
@keyframes gradientAnimation {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

header h1 {
    font-size:2em;
    margin:0;
    color:#ffd966;
    text-shadow: 2px 2px 12px rgba(0,0,0,0.7);
}

/* BOUTON RETOUR */
.backButton {
    padding:10px 20px;
    font-size:16px;
    border-radius:18px;
    border:2px solid #ffd966;
    background: linear-gradient(135deg,#0b2a6f,#1e4fd6);
    color:#fff;
    cursor:pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
}

.backButton:hover {
    transform:translateY(-3px) scale(1.08);
    box-shadow:0 12px 28px rgba(255,217,102,0.7);
    background: linear-gradient(135deg,#1e4fd6,#3a6cff);
}

/* LISTE DES EVENTS */
.eventList {
    display:flex;
    flex-direction:column;
    gap:20px;
    max-width:700px;
    margin:auto;
}

.eventCard {
    background: rgba(10,20,50,0.88);
    border-radius:26px;
    overflow:hidden;
    padding:20px 25px;
    border:2px solid rgba(255,217,102,0.95);
    outline:1px solid rgba(255,217,102,0.45);
    outline-offset:4px;
    box-shadow:
        0 0 20px rgba(255,217,102,0.6),
        0 12px 36px rgba(0,0,0,0.65);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.eventCard:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow:0 16px 36px rgba(255,217,102,0.5), 0 20px 40px rgba(0,0,0,0.6);
}

.eventTitle {
    font-size:1.6em;
    font-weight:bold;
    margin-bottom:8px;
    color:#ffd966;
    text-shadow:1px 1px 6px rgba(0,0,0,0.6);
}

.eventDateTime {
    font-size:0.95em;
    background: #0b3d91;
    color:#fff;
    padding:6px 12px;
    border-radius:12px;
    display:inline-block;
    margin-bottom:8px;
}

.eventLocation {
    font-style:italic;
    margin-bottom:10px;
    color:#f0f2ff;
}

.eventDescription {
    font-size:1em;
    color:#f0f2ff;
    line-height:1.4;
}

.eventCard img {
    width:100%;
    border-radius:12px;
    margin-bottom:12px;
    object-fit:cover;
    max-height:300px;
}

/* MOBILE */
@media(max-width:480px){
    header h1 { font-size:1.5em; }
    .backButton { font-size:14px; padding:8px 16px; }
    .eventTitle { font-size:1.3em; }
    .eventDateTime { font-size:0.85em; padding:4px 8px; }
    .eventDescription { font-size:0.9em; }
}
</style>
</head>

<body>

<header>
    <h1>Événements</h1>
    <button class="backButton" onclick="window.location.href='acceuil.html'">Retour</button>
</header>

<div class="eventList" id="listeEvenements"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Config Firebase (FAUX pour sécurité)
const firebaseConfig = {
  apiKey: "FAUX",
  authDomain: "FAUX",
  projectId: "rocplatforme",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const liste = document.getElementById("listeEvenements");

const q = query(collection(db,"evenements"), orderBy("date"));

onSnapshot(q, snap => {
    liste.innerHTML = "";
    snap.forEach(docu => {
        const e = docu.data();
        const div = document.createElement("div");
        div.className = "eventCard";

        let html = "";
        if(e.imageUrl) html += `<img src="${e.imageUrl}" alt="${e.titre}">`;
        html += `<div class="eventTitle">${e.titre}</div>`;
        html += `<div class="eventDateTime">${e.date} - ${e.heure}</div>`;
        if(e.lieu) html += `<div class="eventLocation">${e.lieu}</div>`;
        if(e.description) html += `<div class="eventDescription">${e.description}</div>`;

        div.innerHTML = html;
        liste.appendChild(div);
    });
});
</script>

</body>

</html>
