<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Membres du ROC </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ===== FOND ROYAL ===== */
body {
    margin: 0; padding: 20px;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    color: #f5f7ff;
    background:
        linear-gradient(rgba(7, 11, 22, 0.8), rgba(3, 6, 12, 0.8)),
        url('https://images.unsplash.com/photo-1598327104500-7dca0a5d6b77?auto=format&fit=crop&w=1470&q=80') center/cover no-repeat fixed;
    background-size: cover;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 2em;
    margin: 0;
    color: #f5ba08;
    text-shadow: 2px 2px 10px rgba(8, 6, 14, 0.842);
}

/* BOUTON RETOUR */
header button {
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 20px;
    border: 2px solid #ffd966;
    background: linear-gradient(135deg, #0b2a6f, #1e4fd6);
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 22px rgba(0,0,0,0.55);
}

header button:hover {
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 12px 28px rgba(255,217,102,0.7);
    background: linear-gradient(135deg, #1e4fd6, #3a6cff);
}

/* MAIN & SECTIONS */
main {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    padding: 25px 15px;
    min-height: calc(100vh - 90px);
    overflow-y: auto;
    justify-content: center;
}

.sectionBox {
    flex: 1 1 45%;
    background: rgba(11,61,145,0.85); /* bleu roi semi-transparent */
    border: 2px solid #e7b10e;
    border-radius: 20px;
    padding: 25px;
    min-width: 240px;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 25px rgba(255,217,102,0.5),
                0 10px 35px rgba(0,0,0,0.7);
}

.sectionBox h3 {
    margin-top: 0;
    font-size: 1.4em;
    color: #f0b70c;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    border-bottom: 2px solid #ffd966;
    padding-bottom: 8px;
}

.sectionBox ul {
    list-style: none;
    padding-left: 0;
    margin-top: 15px;
    flex: 1;
    max-height: 300px;
    overflow-y: auto;
}

.sectionBox li {
    margin-bottom: 6px;
    font-size: 1.05em;
    color: #f5f7ff;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
}

/* MOBILE */
@media(max-width:800px){
    main { flex-direction: column; align-items: center; }
    .sectionBox { max-width: 90%; }
}
</style>
</head>
<body>

<header>
    <h1>Membres du ROC</h1>
    <button onclick="window.location.href='acceuil_admin.html'">Retour</button>
</header>

<main id="sectionsContainer"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLL-lZEwvyiN-5IhCY0Yqpt_ZqYbbu4s",
  authDomain: "rocplatforme.firebaseapp.com",
  projectId: "rocplatforme",
  storageBucket: "rocplatforme.firebasestorage.app",
  messagingSenderId: "655073414371",
  appId: "1:655073414371:web:0bd743e2bb5c0a23e9c9d6",
  measurementId: "G-262B1D5NJV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const sections = ["Soprano","Alto","Ténor","Baryton","Musiciens","Sono"];
const container = document.getElementById("sectionsContainer");
const lists = {};

// Créer les sections
sections.forEach(sec=>{
    const box = document.createElement("div");
    box.className = "sectionBox";
    box.innerHTML = `<h3>${sec}</h3><ul id="${sec.replace(/\s/g,'')}List"></ul>`;
    container.appendChild(box);
    lists[sec] = document.getElementById(sec.replace(/\s/g,'')+"List");
});

// Observer Firestore en temps réel
const q = query(collection(db,"membres"), orderBy("timestamp"));
onSnapshot(q, snapshot=>{
    sections.forEach(sec => lists[sec].innerHTML="");
    snapshot.forEach(docSnap=>{
        const data = docSnap.data();
        if(data.section && data.nom && lists[data.section]){
            const li = document.createElement("li");
            li.textContent = data.nom;
            lists[data.section].appendChild(li);
        }
    });
});
</script>

</body>
</html>
