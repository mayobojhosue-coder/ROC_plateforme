<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Outfits</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background: linear-gradient(180deg,#050b1e,#0b1f4d);
    color:#f5f7ff;
    position:relative;
    overflow-x:hidden;
}

/* IMAGE DISCRÈTE DROITE */
body::before {
    content:"";
    position:fixed;
    bottom:0;
    right:0;
    width:45%;
    height:45%;
    background:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsIpbcWgLE5GrEUast5s-BVDMiqrTlN9Hllw&s")
        no-repeat center center;
    background-size:cover;
    opacity:0.06;
    pointer-events:none;
    z-index:0;
}

/* IMAGE DISCRÈTE GAUCHE */
body::after {
    content:"";
    position:fixed;
    bottom:0;
    left:0;
    width:40%;
    height:40%;
    background:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxPKh9rJu5sqndFFxyqzjOt17FPM3ERMxR3Q&s")
        no-repeat center center;
    background-size:cover;
    opacity: 0.1;;
    pointer-events:none;
    z-index:0;
}

/* CONTENU AU-DESSUS */
body > * {
    position:relative;
    z-index:1;
}

/* HEADER */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
header h1 {
    font-size:2em;
    margin:0;
    color:#ffd966;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
}
header button {
    padding:12px 24px;
    font-size:16px;
    border-radius:14px;
    border:2px solid #ffd966;
    background:linear-gradient(135deg,#0b3d91,#144ea1);
    color:#fff;
    cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s;
}
header button:hover {
    transform:scale(1.05);
    box-shadow:0 4px 14px rgba(255,217,102,0.6);
}

/* CARTES OUTFIT */
.outfitCard {
    border:2px solid #ffd966;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    background:rgba(10, 44, 102, 0.25);
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
}

.outfitCard h3 {
    margin:0 0 12px 0;
    font-size:1.4em;
    color:#ffd966;
}

.colorCircle {
    width:22px;
    height:22px;
    border-radius:50%;
    display:inline-block;
    margin-left:6px;
    vertical-align:middle;
    border:1px solid #000;
}

.infoGroup {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:5px;
    align-items:center;
}

.infoGroup span {
    color:#f5f7ff;
}

.dateLabel {
    font-weight:bold;
    margin-left:auto;
    color:#f3b90c;
}

/* MOBILE : PLUS GRAND */
@media (max-width:480px){
    body {
        padding:25px;
    }

    header {
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }

    header h1 {
        font-size:2.2em;
    
    }

    header button {
        width:100%;
        font-size:18px;
        padding:14px;
    }

    .outfitCard {
        padding:22px;
        border-radius:18px;
    }

    .outfitCard h3 {
        font-size:1.6em;
    }

    .infoGroup {
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .colorCircle {
        width:26px;
        height:26px;
    }

    .dateLabel {
        margin-left:0;
        font-size:1.1em;
    }
}
</style>
</head>
<body>

<header>
    <h1>Dress codes assignés</h1>
    <button onclick="window.location.href='acceuil.html'">Retour</button>
</header>

<div id="outfitsContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLL-XXXX-XXXX",
  authDomain: "rocplatforme.firebaseapp.com",
  projectId: "rocplatforme",
  storageBucket: "rocplatforme.firebasestorage.app",
  messagingSenderId: "655073414371",
  appId: "1:655073414371:web:0bd743e2bb5c0a23e9c9d6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("outfitsContainer");

const q = query(collection(db,"outfits"), orderBy("timestamp"));
onSnapshot(q, snapshot => {
    container.innerHTML = "";
    snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const card = document.createElement("div");
        card.className = "outfitCard";
        card.innerHTML = `
            <h3>${data.haut} + ${data.bas}</h3>
            <div class="infoGroup">
                <span>Haut <span class="colorCircle" style="background-color:${data.hautCouleur}"></span></span>
                <span>Bas <span class="colorCircle" style="background-color:${data.basCouleur}"></span></span>
                <span>Accessoires: ${data.accessoires || "Aucun"}</span>
                <span class="dateLabel">
                    ${data.date
                        ? new Date(data.date).toLocaleDateString('fr-FR', {
                            weekday:'long',
                            day:'numeric',
                            month:'long',
                            year:'numeric'
                        })
                        : "Date non assignée"}
                </span>
            </div>
        `;
        container.appendChild(card);
    });
});
</script>

</body>
</html>
